name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Everything in CI runs from recorded fixtures: no network calls, no funds.
  TOLLGATE_OFFLINE: 'true'

jobs:
  build:
    name: Lint, typecheck, test, bench
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A throwaway database for the ledger tests. Nothing here is a secret: it exists
    # only for this job and is unreachable from outside the runner.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tollgate
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: tollgate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tollgate -d tollgate"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://tollgate:ci-only@localhost:5432/tollgate
      # Makes the Postgres ledger tests fail, not skip, if the database is ever missing.
      REQUIRE_DB: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm -r lint

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Unit and property tests
        run: pnpm -r test

      - name: Build
        run: pnpm -r build

      # The red-team benchmark is the headline evidence: 16 attacks and 5 benign
      # controls against three targets, offline. Skipped until bench/ has code.
      - name: Offline benchmark
        run: |
          if [ -d bench/src ]; then
            pnpm bench
          else
            echo "bench/ not implemented yet — skipping"
          fi

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Reports advisories without blocking a merge. Tighten to a gate before submission.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Audit
        run: pnpm audit --audit-level high
