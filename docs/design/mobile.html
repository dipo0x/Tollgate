<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tollgate Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Geist Pixel';src:url('../../apps/site/public/fonts/GeistPixel-Square.woff2') format('woff2');font-display:swap}
:root{--bg:#050607;--tx:#eef0f3;--mu:#a4a9b2;--dm:#7d838e;--ln:rgba(236,239,244,.1)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Satoshi,Inter,-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:16px;height:60px;padding:0 24px;border-bottom:1px solid var(--ln);background:rgba(5,6,7,.85);backdrop-filter:blur(14px)}
.bar b{font-size:16px;font-weight:600;letter-spacing:-.02em}
.bar .sp{flex:1}
.seg{display:flex;border:1px solid var(--ln);border-radius:12px;padding:3px;gap:3px}
.seg button{height:32px;padding:0 14px;border-radius:9px;font:500 12px 'Geist Mono',monospace;letter-spacing:.08em;color:var(--mu)}
.seg button.on{background:var(--tx);color:#0c0d10}
.hint{font:400 12px 'Geist Mono',monospace;color:var(--dm)}
.play{display:grid;grid-template-columns:280px 1fr 300px;gap:24px;padding:24px;min-height:calc(100vh - 60px)}
.list h3{margin:18px 0 8px;font:500 11px 'Geist Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--dm)}
.list button{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:10px;font-size:14px;color:var(--mu)}
.list button:hover{background:rgba(236,239,244,.05);color:var(--tx)}
.list button.on{background:rgba(255,255,255,.1);color:var(--tx)}
.stagewrap{display:flex;align-items:flex-start;justify-content:center}
.phone{position:relative;width:390px;height:844px;border-radius:52px;overflow-x:hidden;overflow-y:auto;scrollbar-width:none;background:#0a0b0d;box-shadow:0 0 0 1px rgba(236,239,244,.16),0 0 0 11px #0e1013,0 0 0 12px rgba(236,239,244,.16),0 50px 100px -30px rgba(0,0,0,.9);transform-origin:top center}
.side{display:flex;flex-direction:column;gap:12px}
.note{white-space:pre-line;padding:14px 16px;border-radius:14px;font-size:13px;line-height:1.55;color:#c9cdd4}
.grid{padding:24px 32px 80px}
.grid h2{font-size:40px;font-weight:600;letter-spacing:-.04em;margin:40px 0 18px}
.row{display:flex;flex-wrap:wrap;gap:36px}
.cell{display:flex;flex-direction:column;gap:10px}
.cell span{font:500 12px 'Geist Mono',monospace;color:var(--mu)}
.mini{width:234px;height:506px;position:relative;cursor:pointer;border-radius:32px;overflow:hidden;box-shadow:0 0 0 1px rgba(236,239,244,.16),0 30px 60px -30px rgba(0,0,0,.9)}
.mini>div{transform:scale(.6);transform-origin:top left;width:390px;height:844px}
@media (max-width:1100px){.play{grid-template-columns:1fr}.side{display:none}.list{display:flex;flex-wrap:wrap;gap:4px}.list h3{width:100%}.list button{width:auto}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>

n    dot: pz ? '#8E8E93' : '#30D158', state: pz ? 'Paused' : 'Running', pauseLabel: pz ? 'Resume' : 'Pause',\n    togglePause: () => this.setState({ paused: !pz }),\n    line, area, dotX: W, dotY, big, small, caption, from: fromLabel,\n    metrics: [['spent', 'Spent'], ['budget', 'Budget']].map(([id, label]) => ({ label, ...seg(id === m), pick: () => this.setState({ m: id }) })),\n    ranges: [['7d', '7d'], ['30d', '30d'], ['all', 'All']].map(([id, label]) => ({ label, ...seg(id === r), pick: () => this.setState({ r: id }) })),\n  };\n}\n}\n"}, {"id": "Settings", "title": "17 \u00b7 Account", "y": 4092, "h": 1180, "tpl": "\n\n<div style=\"width: 390px; height: 1180px; position: relative; overflow: hidden; box-sizing: border-box; background: radial-gradient(130% 52% at 50% -6%, #4a4243 0%, #1e1b1c 46%, #000 78%); color: #fff; font-family: Satoshi, Inter, -apple-system, BlinkMacSystemFont, system-ui, sans-serif; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column;\">\n\n<div style=\"position: absolute; left: 0; right: 0; top: 50px; bottom: 0; border-radius: 30px 30px 0 0; background: #121214; padding: 0 16px; box-sizing: border-box; display: flex; flex-direction: column; animation: sheetUp .5s cubic-bezier(.2,.8,.2,1) both;\">\n  <span aria-hidden=\"true\" style=\"align-self: center; width: 38px; height: 5px; border-radius: 3px; background: #48484A; margin-top: 8px;\"><\/span>\n  <div style=\"height: 56px; display: flex; align-items: center; justify-content: center; position: relative;\"><span style=\"font-size: 18px; font-weight: 600;\">Account<\/span><a href=\"Home.dc.html\" style=\"position: absolute; right: 0; height: 40px; padding: 0 18px; border-radius: 20px; background: #2C2C2E; display: flex; align-items: center; font-size: 16px; font-weight: 600;\">Done<\/a><\/div>\n  <div style=\"margin-top: 4px; border-radius: 22px; background: #1C1C1E; padding: 16px; display: flex; align-items: center; gap: 14px;\">\n    <span style=\"width: 54px; he ex-direction: column; gap: 2px; flex-grow: 1; min-width: 0;\"><span style=\"font-size: 16px; color: #fff;\">Verified<\/span><\/div><span style=\"font-size: 16px; color: #30D158;\">Yes<\/span><\/div><div style=\"padding: 13px 16px; border-top: 1px solid rgba(255,255,255,.08); display: flex; justify-content: space-between; gap: 12px;\"><span style=\"font-size: 16px; color: #8E8E93;\">Shop\u2019s own text<\/span><span style=\"font-size: 16px; color: #636366; text-decoration: line-through;\">Never shown<\/span><\/div><\/div><\/div>\n<\/div>\n", "css": "\nbody{margin:0;background:#000}\na{color:#fff;text-decoration:none}a:hover{color:#fff;opacity:.85}\ninput::placeholder{color:#636366}\n@keyframes rise{from{opacity:0;transform:translateY(14px)}}\n@keyframes fade{from{opacity:0}}\n@keyframes pop{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.06)}100%{opacity:1;transform:none}}\n@keyframes spin{to{transform:rotate(360deg)}}\n@keyframes draw{to{stroke-dashoffset:0}}\n@keyframes ping{to{transform:scale(2.6);opacity:0}}\n@keyframes sheetUp{from{transform:translateY(60px);opacity:0}}\n@keyframes drop{0%{opacity:0;transform:translateY(-110px) scale(.94)}65%{opacity:1;transform:translateY(6px)}100%{transform:none}}\n@keyframes beam{from{top:16px}to{top:228px}}\n@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}\n@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}\n@keyframes shakeB{0%,100%{transform:translateX(0)}25%{transform:translateX(7px)}50%{transform:translateX(-6px)}75%{transform:translateX(3px)}}\n@keyframes grow{from{transform:scaleX(0)}}\n@keyframes line{to{stroke-dashoffset:0}}\n", "logic": "\nreturn class extends DCLogic {\nconstructor(props) { super(props); this.state = { f: 'on' }; }\nrenderVals() {\n  const f = this.state.f;\n  const ALL = [{ on: true, n: 'Bridge cost brief', w: 'Ours \u00b7 0.20 USDC \u00b7 live 1Click' }, { on: false, n: 'Negotiating seller', w: 'Ours \u00b7 opens 0.30, floor 0.20' }, { on: false, n: 'Rate-check worker', w: 'Ours \u00b7 paid per job' }];\n  const shops = ALL.filter(s => f === 'on' ? s.on : !s.on).map((s, i) => ({ ...s, sep: i === 0 ? '0' : '1px solid rgba(255,255,255,.08)', st: s.on ? 'On' : 'Off', c: s.on ? '#30D158' : '#8E8E93' }));\n  const tabs = [['on', 'Enabled'], ['off', 'Available']].map(([id, label]) => ({ label, bg: id === f ? '#F2F2F2' : '#1C1C1E', fg: id === f ? '#000' : '#fff', pick: () => this.setState({ f: id }) }));\n  return { shops, tabs };\n}\n}\n"}], "rows": [["Onboarding", 0], ["The approval loop", 1264], ["Control", 2528], ["Agents & account", 4092]], "notes": ["Two colours of meaning only: green for paid or on, red for blocked. Everything else is white or grey.\n\nValues come from real runs: the 0.206712 USDC NEAR payment on 3 Nov and the 3 Nov live test, 9 of 9 decisions matched.", "No recovery phrase on purpose: the phone holds no key. Top up only shows the account to send to; Tollgate is not a wallet.\n\nNeeds gateway work: approver token, Face ID check on approve, chat endpoint, push. The gateway runs on the owner\u2019s own server over HTTPS (today it only listens on the same machine)."]}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent)
const h = React.createElement
const EVENTS = { onclick: 'onClick', onpointerdown: 'onPointerDown', onpointerup: 'onPointerUp', onpointerleave: 'onPointerLeave', onsubmit: 'onSubmit', oninput: 'onInput', onchange: 'onChange' }
const HOLE = /\{\{\s*([^}]+?)\s*\}\}/g, WHOLE = /^\{\{\s*([^}]+?)\s*\}\}$/
const get = (sc, p) => { p = p.trim(); if (p === 'true') return true; if (p === 'false') return false; if (/^-?\d/.test(p)) return Number(p); return p.split('.').reduce((o, k) => o == null ? undefined : o[k], sc) }
const fill = (s, sc) => s.replace(HOLE, (_, p) => { const v = get(sc, p); return v == null ? '' : v })
const camel = s => s.startsWith('--') ? s : s.replace(/^-webkit-/, 'Webkit-').replace(/-([a-zA-Z])/g, (_, c) => c.toUpperCase())
function styleObj(str) {
  const o = {}
  for (const part of str.split(';')) { const i = part.indexOf(':'); if (i < 0) continue; const k = part.slice(0, i).trim(); if (k) o[camel(k)] = part.slice(i + 1).trim() }
  return o
}
const tplCache = {}
function tplOf(s) { if (!tplCache[s.id]) { const t = document.createElement('template'); t.innerHTML = s.tpl; tplCache[s.id] = t.content } return tplCache[s.id] }

function kids(node, sc, nav) { const out = []; node.childNodes.forEach((c, i) => { const r = conv(c, sc, nav, i); if (r !== null && r !== undefined) out.push(r) }); return out }
function conv(n, sc, nav, key) {
  if (n.nodeType === 3) { const t = n.textContent; return t.includes('{{') ? fill(t, sc) : t }
  if (n.nodeType !== 1) return null
  const tag = n.localName
  if (tag === 'sc-for') {
    const list = get(sc, n.getAttribute('list').replace(WHOLE, '$1')) || [], as = n.getAttribute('as')
    return h(React.Fragment, { key }, list.map((it, i) => h(React.Fragment, { key: i }, kids(n, { ...sc, [as]: it, $index: i }, nav))))
  }
  if (tag === 'sc-if') return get(sc, n.getAttribute('value').replace(WHOLE, '$1')) ? h(React.Fragment, { key }, kids(n, sc, nav)) : null
  const props = { key }
  for (const a of n.attributes) {
    const name = a.name, v = a.value
    if (name.startsWith('hint-')) continue
    const w = v.match(WHOLE)
    if (EVENTS[name]) { const fn = w ? get(sc, w[1]) : null; if (fn) props[EVENTS[name]] = fn; continue }
    const val = w && name !== 'style' ? get(sc, w[1]) : v.includes('{{') ? fill(v, sc) : v
    if (name === 'style') props.style = styleObj(val)
    else if (name === 'class') props.className = val
    else if (name === 'for') props.htmlFor = val
    else if (name.startsWith('aria-') || name.startsWith('data-')) props[name] = val
    else if (name.includes('-')) props[camel(name)] = val
    else props[name] = val
  }
  if (tag === 'a' && props.href) {
    const m = String(props.href).match(/^([A-Za-z0-9_]+)\.dc\.html$/)
    if (m) { const to = m[1]; props.href = '#' + to; props.onClick = e => { e.preventDefault(); nav(to) } }
    else if (/^https?:/.test(props.href)) { props.target = '_blank'; props.rel = 'noopener noreferrer' }
  }
  if (tag === 'form') { const fn = props.onSubmit; props.onSubmit = e => { e.preventDefault(); if (fn) fn(e) } }
  if (tag === 'input' && props.onInput) { props.onChange = props.onInput; delete props.onInput }
  else if (tag === 'input' && 'value' in props) { props.defaultValue = props.value; delete props.value }
  const ch = kids(n, sc, nav)
  return h(tag, props, ...ch)
}

class DCLogic extends React.Component {
  render() { return h(React.Fragment, null, kids(tplOf(this.props.__screen), this.renderVals(), this.props.__nav)) }
  renderVals() { return {} }
}
const classes = {}
for (const s of D.screens) { try { classes[s.id] = new Function('DCLogic', 'React', s.logic)(DCLogic, React) } catch (e) { console.error(s.id, e); classes[s.id] = class extends DCLogic {} } }

// Each screen lives in its own shadow root, so its keyframes and styles never collide with another screen's.
function Screen({ id, nav }) {
  const ref = React.useRef(null)
  const [shadow, setShadow] = React.useState(null)
  React.useLayoutEffect(() => {
    const host = ref.current
    const sr = host.shadowRoot || host.attachShadow({ mode: 'open' })
    sr.innerHTML = ''
    const st = document.createElement('style')
    st.textContent = ':host{display:block;width:390px;height:' + D.screens.find(s => s.id === id).h + 'px}a{color:#eef0f3;text-decoration:none}' + D.screens.find(s => s.id === id).css
    sr.appendChild(st)
    const mount = document.createElement('div'); sr.appendChild(mount)
    setShadow(mount)
  }, [id])
  const s = D.screens.find(x => x.id === id), C = classes[id]
  return h('div', { ref }, shadow ? ReactDOM.createPortal(h(C, { __screen: s, __nav: nav }), shadow) : null)
}

const order = D.screens.map(s => s.id)
function App() {
  const [mode, setMode] = React.useState('play')
  const [cur, setCur] = React.useState(location.hash.slice(1) && order.includes(location.hash.slice(1)) ? location.hash.slice(1) : order[0])
  const [n, setN] = React.useState(0)
  const [scale, setScale] = React.useState(1)
  const nav = React.useCallback(to => { if (!order.includes(to)) return; setCur(to); setN(x => x + 1); setMode('play'); history.replaceState(null, '', '#' + to); window.scrollTo(0, 0) }, [])
  React.useEffect(() => {
    const fit = () => setScale(Math.min(1, (innerHeight - 110) / 844))
    fit(); addEventListener('resize', fit)
    const key = e => { if (e.target.tagName === 'INPUT') return; const i = order.indexOf(cur); if (e.key === 'ArrowRight') nav(order[Math.min(order.length - 1, i + 1)]); if (e.key === 'ArrowLeft') nav(order[Math.max(0, i - 1)]) }
    addEventListener('keydown', key)
    document.getElementById('mPlay').onclick = () => setMode('play'); document.getElementById('mGrid').onclick = () => setMode('grid')
    document.getElementById('mPlay').className = mode === 'play' ? 'on' : ''; document.getElementById('mGrid').className = mode === 'grid' ? 'on' : ''
    document.getElementById('cur').textContent = mode === 'play' ? D.screens.find(s => s.id === cur).title : '' + order.length + ' screens'
    return () => { removeEventListener('resize', fit); removeEventListener('keydown', key) }
  }, [cur, mode, nav])
  if (mode === 'grid') {
    return h('div', { className: 'grid' }, D.rows.map(([label, y]) => h(React.Fragment, { key: label },
      h('h2', null, label),
      h('div', { className: 'row' }, D.screens.filter(s => s.y === y).map(s => h('div', { className: 'cell', key: s.id },
        h('div', { className: 'mini', onClick: () => nav(s.id), title: 'Open ' + s.title }, h('div', null, h(Screen, { id: s.id, nav }))),
        h('span', null, s.title)))))))
  }
  return h('div', { className: 'play' },
    h('div', { className: 'list' }, D.rows.map(([label, y]) => h(React.Fragment, { key: label },
      h('h3', null, label),
      D.screens.filter(s => s.y === y).map(s => h('button', { key: s.id, className: s.id === cur ? 'on' : '', onClick: () => nav(s.id) }, s.title))))),
    h('div', { className: 'stagewrap' }, h('div', { style: { height: 844 * scale + 20 } }, h('div', { className: 'phone', style: { transform: `scale(${scale})` } }, h(Screen, { id: cur, nav, key: cur + ':' + n })))),
    h('div', { className: 'side' },
      h('div', { className: 'note', style: { background: '#1C1C1E' } }, D.notes[0]),
      h('div', { className: 'note', style: { background: '#1C1C1E' } }, D.notes[1])))
}
ReactDOM.createRoot(document.getElementById('app')).render(h(App))
</script></body></html>
